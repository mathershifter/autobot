[project]
name = "autobot"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pexpect>=4.9.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
autobot = "autobot.cli:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# src/autobot/autobot.2026-10.json is a link to schemas/autobot.2026-10.json, the one copy of the schema:
# the wheel gets the file itself, and the sdist needs the link's target as well
source-include = ["schemas/autobot.2026-10.json"]

[tool.pytest.ini_options]
markers = [
    "slow: needs the 5s get_prompt idle poll, or repeats a run many times; deselect with -m 'not slow'",
    "build: runs `uv build` and checks the wheel and sdist; skipped without uv or its cached build backend",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
