[project]
name = "autobot"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pexpect>=4.9.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
autobot = "autobot.cli:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
