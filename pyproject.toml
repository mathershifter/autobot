[project]
name = "autobot"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pexpect>=4.9.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
autobot = "autobot.cli:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = ["slow: needs the 5s get_prompt idle poll; deselect with -m 'not slow'"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
