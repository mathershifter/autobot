version: 0.1.0


vars:
  creds:
    # SONiC and SONiC-BMC
    - username: admin
      password: ""
    # 
    - username: admin
      password: none

prompts:
  - name: cli
    expect:
      - '[\w+\-\.:\/\[\]]+(?:\([^\)]+\)){,3}(?:>|#) ?$'
      - '\-?(?:bash)?(?:\-\d\.\d)? ?[>#\$] ?$'
    return: true

  - name: login
    expect:
      - ['(?:L|l)ogin:', '(?:P|p)assword:']
    send:
      each: vars.creds
      fields: [username, password]

attach:
  spawn: ssh jmather-home
  script:
    # - line: a dut grab -sf -p labtracker ldp448
    - line: a dut attach mrdp360
    - return: 1
      when: "attached to"
  timeout: 300s
  breakout:
    script:
      - line: logout
      - control: "]"
      - line: logout

errors:
  - '% .*'
  - '! .*'

script:
  - cmd: |
      enable
      configure session
      hostname {{ args.hostname }}
      ! lab switches enable root backdoor and nopassword admin, bad idea IRL
      username admin privilege 15 role network-admin nopassword
      aaa root secret root
      aaa authentication policy local allow-nopassword-remote-login
      aaa authentication policy on-success log
      aaa authentication policy on-failure log
      aaa authorization exec default local
      aaa authorization commands all default local
      vrf instance {{ args.mgmt_vrf }}
      interface {{ args.mgmt_intf | default('Management1') }}
      vrf {{ args.mgmt_vrf }}
      ip address {{ args.mgmt_ip }}
      exit
      ip route vrf {{ args.mgmt_vrf }} 0.0.0.0/0 {{ args.mgmt_gw }}
      commit

  - block:
    name: run 'uname -a' from bash
    enter:
      script:
        - line: bash
      breakout:
        script:
          - line: exit
    script:
      - cmd: |
          #!/bin/sh
          uname -a

