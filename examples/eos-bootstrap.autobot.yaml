autobot: 2026-10

vars:
  creds:
    # SONiC and SONiC-BMC
    - username: admin
      password: ""
    # 
    - username: admin
      password: none

prompts:
  - name: cli
    # Every regex starts at the beginning of a line: (?<![^\x00-\x1f]) means that nothing printable
    # comes before it on the line (the engine consumes line breaks and escape sequences as they
    # arrive, so a prompt is normally the first thing in the unread output). Without it, any output
    # that happens to end a read with '>', '#' or '$' is taken for a prompt. The price: a prompt
    # printed right after output that has no final newline (printf foo) is not recognized.
    expect:
      # EOS CLI: 'switch>', 'switch#', 'switch(config-if-Et1)#'
      - '(?<![^\x00-\x1f])[\w+\-\.:\/\[\]]+(?:\([^)\r\n]+\)){,3}(?:>|#) ?$'
      # bash without a PS1: 'bash-5.1# ', '-bash-4.2$ '
      - '(?<![^\x00-\x1f])\-?bash(?:\-\d+\.\d+)?[#\$] ?$'
      # bash from the EOS CLI: '[admin@switch ~]$ '
      - '(?<![^\x00-\x1f])\[[\w\-\.]+@[\w\-\.]+ [^\]\r\n]*\][#\$] ?$'
    return: true

  - name: login
    send:
      each: vars.creds
      fields:
        - match: '(?:L|l)ogin:'
          field: username
        - match: '(?:P|p)assword:'
          field: password

attach:
  spawn: ssh jmather-home
  script:
    # - line: a dut grab -sf -p labtracker ldp448
    - line: a dut attach mrdp360
    - return: 1
      after: "attached to"
  timeout: 300s
  breakout:
    script:
      - line: logout
      - control: "]"
      - line: logout

errors:
  - '% .*'
  - '! .*'

script:
  - cmd: |
      enable
        configure session
          hostname {{ args.hostname }}
          ! lab switches enable root backdoor and nopassword admin, bad idea IRL
          username admin privilege 15 role network-admin nopassword
          !
          aaa root secret root
          aaa authentication policy local allow-nopassword-remote-login
          aaa authentication policy on-success log
          aaa authentication policy on-failure log
          aaa authorization exec default local
          aaa authorization commands all default local
          !
          vrf instance {{ args.mgmt_vrf }}
          !
          interface {{ args.mgmt_intf | default('Management1') }}
            vrf {{ args.mgmt_vrf }}
            ip address {{ args.mgmt_ip }}
            exit
          !
          ip route vrf {{ args.mgmt_vrf }} 0.0.0.0/0 {{ args.mgmt_gw }}
          commit
        exit

