# Upgrade a SONiC switch through its console.
#
#   autobot run -e DUT=<name> examples/sonic.autobot.yaml
#   autobot run -e DUT=<name> -e SONIC_VERSION=202505 examples/sonic.autobot.yaml
#   autobot run -e DUT=<name> -e SONIC_IMAGE=https://host/sonic.swi examples/sonic.autobot.yaml
#
# A variable of the env section takes its value from -e or from the environment
# (DUT=<name> autobot run ...); one with an empty value here must get it there,
# or from prepare, which builds SONIC_IMAGE unless it is given.
autobot: 2026-10

env:
  DUT:
  ARTIFACTORY: https://ci.corp.io
  SONIC_VERSION: "202511"
  SONIC_IMAGE:
  NAMESERVER: 172.22.22.10

# a local shell script: it reads the variables above, and what it assigns is their value
prepare: |
  : "${SONIC_IMAGE:=$ARTIFACTORY/artifactory/sonic-nightly/$SONIC_VERSION/sonic-aboot-broadcom/latest/sonic-aboot-broadcom.swi}"

vars:
  creds:
    # SONiC and SONiC-BMC
    - username: admin
      password: password
    # 
    - username: root
      password: 0penBmc

prompts:
  - name: cli
    # The regex starts with ^, so a prompt must begin its line. Without it, output that has
    # user@host: in it and ends a read with '$' or '#' (scp admin@host:/x $) is taken for a
    # prompt. The cost: a prompt with other text in front of it on its line is not recognised,
    # such as one printed right after output with no final newline (printf 'done. ').
    expect:
      # bash on SONiC: 'admin@sonic:~$ ', 'root@sonic:/var/log# '
      - '^\w+@[\w.-]+:[^\r\n]*[$#] ?$'
    return: true

  - name: login
    # Each regex ends with $: a login prompt is the last thing the switch has written. Without
    # the $, the 'Last login: ...' line printed after a login is answered too, with the next user
    # name. If a slow console delivers that line in pieces, put the host name in the first regex,
    # e.g. 'switch1 login: ?$'.
    send:
      each: vars.creds
      fields:
        - match: '[Ll]ogin: ?$'
          field: username
        - match: '[Pp]assword: ?$'
          field: password

attach:
  spawn: ssh jmather-home
  # script to run after spawning the session, before running any steps
  script:
    - line: a dut attach {{ env.DUT }}
    - return: 1
      after: "attached to"
    - control: c
  timeout: 300s
  breakout:
    # Log out of the switch before detaching: its console stays logged in if the connection just
    # closes. Ctrl-C first, so that logout starts on an empty line. The 2s wait is there because
    # Ctrl-C throws away whatever was sent and not read yet.
    - control: c
      delay_before: 2s
    - line: logout
    # Leave the console server (Ctrl-]) only once the switch asks for a login again. If it doesn't
    # within 30s, the breakout fails here and the run reports that the console may be logged in.
    - control: "]"
      after: '[Ll]ogin: ?$'
      timeout: 30s

fn:
  is_system_running:
    script:
      - cmd: systemctl is-system-running --wait
        assert:
          - running
          - degraded

  reboot:
    script:
      - line: sudo reboot now
        delay_after: 10s

script:
  - cmd: show version | grep Version

  - cmd: sudo config dns nameserver add {{ env.NAMESERVER }}
    ignore_error: true

  - block:
      name: Upgrade SONiC
      script:
        - cmd: sudo sonic-installer list | grep -e 'Next:'
          ignore_error: true
          register: next_version
        # the image the switch boots next, without its label: 'Next: SONiC-OS-202511.1' is
        # 'SONiC-OS-202511.1'. A set value is a template, rendered where the step stands.
        - set:
            next_image: "{{ vars.next_version | replace('Next:', '') | trim }}"
        # - cmd: "echo 'Next image: {{ vars.next_image }}'"
        - block:
            name: Upgrade SONiC
            script:
              - cmd: sudo sonic-installer install -y {{ env.SONIC_IMAGE }}
              - call: reboot
          when: "{{ env.SONIC_VERSION not in vars.next_image }}"
        # - block:
        #     name: Check Aboot
        #     prompts:
        #       - name: aboot
        #         expect:
        #           - '(?:A|a)boot#'
        #         return: true
        #     script:
        #       - control: c
        #         after: 'Press Control-C now to enter Aboot shell'
        #       - cmd: uname -a
        #     breakout:
        #       - line: exit
      
  - call: is_system_running

  - cmd: show version | grep 'Software Version'
    assert: "{{ env.SONIC_VERSION }}"
