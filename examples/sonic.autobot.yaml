autobot: 2026-08

env:
  ARTIFACTORY: https://ci.corp.io
  SONIC_VERSION: "202605"
  SONIC_IMAGE: '{{ env.ARTIFACTORY }}/artifactory/sonic-nightly/{{ env.SONIC_VERSION }}/sonic-aboot-broadcom/latest/sonic-aboot-broadcom.swi'
  NAMESERVER: 172.22.22.10

vars:
  creds:
    # SONiC and SONiC-BMC
    - username: admin
      password: password
    # 
    - username: root
      password: 0penBmc

prompts:
  - name: cli
    expect:
      - '\w+@[\w\-\.]+:[^\$]+'
    return: true

  - name: login
    expect:
      - ['(?:L|l)ogin:', '(?:P|p)assword:']
    send:
      each: vars.creds
      fields: [username, password]

attach:
  prepare: |
    #!/bin/sh
    arista-ssh check-auth || arista-ssh login
  spawn: ssh jmather-home
  script:
    # - line: a dut grab -sf -p labtracker ldp448
    - line: a dut attach ldp448
    - return: 1
      when: "attached to"
  timeout: 300s
  breakout:
    script:
      - line: logout
      - control: "]"
      - line: logout

fn:
  is_system_running:
    script:
      - cmd: systemctl is-system-running --wait
        assert:
          - running

  reboot:
    script:
      - cmd: sudo reboot now
        delay_after: 10s

script:
  - call: is_system_running
  
  - cmd: show version | grep Version
    assert: "{{ env.SONIC_VERSION }}"

  - call: is_system_running

  - block:
      name: Update SONiC
      script:
        - call: is_system_running
        - cmd: sudo config dns nameserver add {{ env.NAMESERVER }}
          ignore_error: true
        - cmd: sudo sonic-installer install -y {{ env.SONIC_IMAGE }}
        - call: reboot
  
  - block:
      name: Check Aboot
      script:
        - control: c
          when: 'Press Control-C now to enter Aboot shell'
        - line: uname -a
          when: '(?:A|a)boot#'
      breakout:
        script:
          - line: exit
            when: '(?:A|a)boot#'
      
  - call: is_system_running

  - cmd: show version | grep 'Software Version'
    assert: "{{ env.SONIC_VERSION }}"
