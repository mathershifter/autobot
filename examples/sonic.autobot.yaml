autobot: 2026-08

env:
  ARTIFACTORY: https://ci.corp.io
  SONIC_VERSION: "202511"
  SONIC_IMAGE: '{{ env.ARTIFACTORY }}/artifactory/sonic-nightly/{{ env.SONIC_VERSION }}/sonic-aboot-broadcom/latest/sonic-aboot-broadcom.swi'
  NAMESERVER: 172.22.22.10

vars:
  creds:
    # SONiC and SONiC-BMC
    - username: admin
      password: password
    # 
    - username: root
      password: 0penBmc

prompts:
  - name: cli
    expect:
      - '\w+@[\w\-\.]+:[^\$]+'
    return: true

  - name: login
    expect:
      - ['(?:L|l)ogin:', '(?:P|p)assword:']
    send:
      each: vars.creds
      fields: [username, password]

attach:
  spawn: ssh jmather-home
  # script to run after spawning the session, before running any steps
  script:
    - line: a dut attach {{ args.dut }}
    - return: 1
      after: "attached to"
    - control: c
  timeout: 300s
  breakout:
    script:
      - line: logout
      - control: "]"

fn:
  is_system_running:
    script:
      - cmd: systemctl is-system-running --wait
        assert:
          - running
          - degraded

  reboot:
    script:
      - line: sudo reboot now
        delay_after: 10s

script:
  - cmd: show version | grep Version

  - cmd: sudo config dns nameserver add {{ env.NAMESERVER }}
    ignore_error: true

  - block:
      name: Upgrade SONiC
      script:
        - cmd: sudo sonic-installer list | grep '{{ env.SONIC_VERSION }}'
          ignore_error: true
        - block:
            name: Upgrade SONiC
            script:
              - cmd: sudo sonic-installer install -y {{ env.SONIC_IMAGE }}
              - call: reboot
          when: "{{ env.SONIC_VERSION not in session.before }}"
        # - block:
        #     name: Check Aboot
        #     prompts:
        #       - name: aboot
        #         expect:
        #           - '(?:A|a)boot#'
        #         return: true
        #     script:
        #       - control: c
        #         after: 'Press Control-C now to enter Aboot shell'
        #       - cmd: uname -a
        #     breakout:
        #       script:
        #         - line: exit
      
  - call: is_system_running

  - cmd: show version | grep 'Software Version'
    assert: "{{ env.SONIC_VERSION }}"
