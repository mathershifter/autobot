autobot: 2026-10

env:
  ARTIFACTORY: https://ci.corp.io
  SONIC_VERSION: "202511"
  SONIC_IMAGE: '{{ env.ARTIFACTORY }}/artifactory/sonic-nightly/{{ env.SONIC_VERSION }}/sonic-aboot-broadcom/latest/sonic-aboot-broadcom.swi'
  NAMESERVER: 172.22.22.10

vars:
  creds:
    # SONiC and SONiC-BMC
    - username: admin
      password: password
    # 
    - username: root
      password: 0penBmc

prompts:
  - name: cli
    # The regex starts with ^, so a prompt must begin its line. Without it, output that has
    # user@host: in it and ends a read with '$' or '#' (scp admin@host:/x $) is taken for a
    # prompt. The cost: a prompt with other text in front of it on its line is not recognised,
    # such as one printed right after output with no final newline (printf 'done. ').
    expect:
      # bash on SONiC: 'admin@sonic:~$ ', 'root@sonic:/var/log# '
      - '^\w+@[\w.-]+:[^\r\n]*[$#] ?$'
    return: true

  - name: login
    send:
      each: vars.creds
      fields:
        - match: '(?:L|l)ogin:'
          field: username
        - match: '(?:P|p)assword:'
          field: password

attach:
  spawn: ssh jmather-home
  # script to run after spawning the session, before running any steps
  script:
    - line: a dut attach {{ args.dut }}
    - return: 1
      after: "attached to"
    - control: c
  timeout: 300s
  breakout:
    # Log out of the switch before detaching: its console stays logged in when the connection
    # just closes. Ctrl-C first, so that logout starts on an empty line: it drops a half-typed
    # line and stops a command that is still running. Ctrl-C also throws away whatever was
    # sent and not read yet, so it waits 2s for the switch to take what was sent last.
    - control: c
      delay_before: 2s
    - line: logout
    # Leave the console server (Ctrl-]) once the switch asks for a login again. If it doesn't
    # within 30s, the breakout fails here, and the run reports that the console may be logged in.
    - control: "]"
      after: 'login:'
      timeout: 30s

fn:
  is_system_running:
    script:
      - cmd: systemctl is-system-running --wait
        assert:
          - running
          - degraded

  reboot:
    script:
      - line: sudo reboot now
        delay_after: 10s

script:
  - cmd: show version | grep Version

  - cmd: sudo config dns nameserver add {{ env.NAMESERVER }}
    ignore_error: true

  - block:
      name: Upgrade SONiC
      script:
        - cmd: sudo sonic-installer list | grep -e 'Next:'
          ignore_error: true
          register: next_version
        # - cmd: "echo 'Next version: {{ vars.next_version }}'"
        - block:
            name: Upgrade SONiC
            script:
              - cmd: sudo sonic-installer install -y {{ env.SONIC_IMAGE }}
              - call: reboot
          when: "{{ env.SONIC_VERSION not in vars.next_version }}"
        # - block:
        #     name: Check Aboot
        #     prompts:
        #       - name: aboot
        #         expect:
        #           - '(?:A|a)boot#'
        #         return: true
        #     script:
        #       - control: c
        #         after: 'Press Control-C now to enter Aboot shell'
        #       - cmd: uname -a
        #     breakout:
        #       - line: exit
      
  - call: is_system_running

  - cmd: show version | grep 'Software Version'
    assert: "{{ env.SONIC_VERSION }}"
