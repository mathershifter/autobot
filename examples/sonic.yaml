version: 0.1.0

env:
  ARTIFACTORY: https://ci.corp.io
  SONIC_IMAGE: '{{ env.ARTIFACTORY }}/artifactory/sonic-nightly/202605/sonic-aboot-broadcom/latest/sonic-aboot-broadcom.swi'
  NAMESERVER: 1.2.3.4

vars:
  creds:
    # SONiC and SONiC-BMC
    - username: admin
      password: password
    # 
    - username: root
      password: 0penBmc

prompts:
  - name: cli
    expect:
      - '\w+@[\w\-\.]+:[^\$]+'
      - '(arista-)?bmc-boot=>'
    return: true

  - name: login
    expect:
      - ['(?:L|l)ogin:', '(?:P|p)assword:']
    send:
      each: vars.creds
      fields: [username, password]

attach:
  prepare: |
    #!/bin/sh
    arista-ssh check-auth || arista-ssh login
  spawn: ssh jmather-home
  script:
    # - line: a dut grab -sf -p labtracker ldp448
    - line: a dut attach ldp448
    - return: 1
      when: "attached to"
  timeout: 300s
  breakout:
    script:
      - line: logout
      - control: "]"
      - line: logout

fn:
  is_system_running:
    script:
      - cmd: systemctl is-system-running --wait
        assert:
          - running

  reboot:
    script:
      - cmd: sudo reboot now
        delay_after: 10s

script:
  - call: is_system_running
  
  - cmd: show version | grep Version
    assert: "SONiC Software Version: SONiC.branch.202605"

  - call: is_system_running

  # - block:
