version: 0.1.0

env:
  SONIC_IMAGE: http://artifacts/sonic/202605/sonic-aboot-broadcom.swi

vars:
  creds:
    # SONiC and SONiC-BMC
    - username: admin
      password: password
    # 
    - username: root
      password: 0penBmc

prompts:
  - name: cli
    expect:
      - '\w+@[\w\-\.]+:[^\$]+'
      - '(arista-)?bmc-boot=>'
    return: true

  - name: login
    expect:
      - ['(?:L|l)ogin:', '(?:P|p)assword:']
    send:
      each: vars.creds
      fields: [username, password]

attach:
  spawn: ssh jmather-home
  script:
    # - line: a dut grab -sf -p labtracker ldp448
    - line: a dut attach ldp448
    - return: 1
      when: "attached to"
  timeout: 300s
  breakout:
    script:
      - line: logout
      - control: "]"
      - line: logout

fn:
  is_system_running:
    script:
      - cmd: systemctl is-system-running --wait
        assert:
          - running

  reboot:
    script:
      - cmd: sudo reboot now
        delay_after: 10s
script:

  - call: is_system_running
  
  - cmd: show version | grep Version
    # assert: "SONiC Software Version: SONiC.branch.202511-ars"
    assert: "SONiC Software Version: SONiC.branch.202605"

  - call: is_system_running

  # - block:
  #     name: Install SONiC
  #     script:
  #       # - cmd: consutil connect 0
  #       - call: is_system_running
  #       - cmd: sudo config dns nameserver add 172.22.22.10
  #       - cmd: sudo sonic-installer install -y {{ env.SONIC_IMAGE }}
  #       - cmd: sudo reboot now
  - cmd: sudo reboot now

  - block:
      name: Check aboot
      script:
        - control: c
          when: 'Press Control-C now to enter Aboot shell'
        - cmd: uname -a
          when: '(?:A|a)boot#'
      breakout:
        script:
          - cmd: exit
            when: '(?:A|a)boot#'
      
  - call: is_system_running

  - cmd: show version
    assert: "SONiC Software Version: SONiC.branch.202605"
